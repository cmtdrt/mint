name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt (check)
        run: make fmtcheck

      - name: go vet
        run: make vet

      - name: Tests
        run: make test

